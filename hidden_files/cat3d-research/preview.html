<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat 3D Preview — Quaternius (CC0)</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFF8F1;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  #app { position:fixed; inset:0; }
  #cap { position:fixed; left:12px; bottom:10px; font-size:12px; color:#8a7a66;
    background:rgba(255,255,255,.75); padding:6px 10px; border-radius:10px; }
  #anim { position:fixed; right:12px; bottom:10px; font-size:12px; color:#8a7a66;
    background:rgba(255,255,255,.75); padding:6px 10px; border-radius:10px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="cap">Quaternius animated cat &middot; CC0 1.0 &middot; recolored brand orange &middot; studio preview</div>
<div id="anim"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const ANIM = q.get('anim') || 'greet';   // Idle | Dance | Yes | No | Walk | Jump | greet

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#FFF8F1');

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 60);

// ---- studio lighting ----
scene.add(new THREE.HemisphereLight('#fff6ea', '#e8d9c4', 0.85));
const key = new THREE.DirectionalLight('#ffffff', 2.0);
key.position.set(3.2, 5.2, 3.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left=-4; key.shadow.camera.right=4;
key.shadow.camera.top=5;  key.shadow.camera.bottom=-3;
key.shadow.radius = 6; key.shadow.blurSamples = 12;
scene.add(key);
const fill = new THREE.DirectionalLight('#cfe8ff', 0.55);
fill.position.set(-4, 2.4, -1.5); scene.add(fill);
const rim = new THREE.DirectionalLight('#ffd9a8', 0.7);
rim.position.set(-1.5, 3.2, -4.5); scene.add(rim);

// ---- ground: soft studio disc + contact shadow ----
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.ShadowMaterial({ opacity: 0.16 })
);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(2.6, 64),
  new THREE.MeshStandardMaterial({ color:'#FFEFD6', roughness:1 })
);
disc.rotation.x = -Math.PI/2; disc.position.y = -0.002; disc.receiveShadow = true; scene.add(disc);

// ---- brand recolor ----
const BRAND = {
  Cat_Main:      '#FF9E3D',
  Cat_Secondary: '#C96A12',
  Ears:          '#F4A9BC',
  Eye_White:     '#FFFFFF',
  Eye_Black:     '#2b2118',
};

const loader = new GLTFLoader();
const gltf = await loader.loadAsync('quaternius_cat_fixed.glb');
const cat = gltf.scene;
cat.traverse(o => {
  if (o.isMesh) {
    o.castShadow = true; o.receiveShadow = false;
    o.frustumCulled = false;
    const m = o.material;
    if (m && m.name && BRAND[m.name]) { m.color.set(BRAND[m.name]); m.roughness = 0.85; m.metalness = 0; }
  }
  if (o.isSkinnedMesh) {
    // Critical: bones are not descendants of the mesh; 'detached' bind mode is required
    // for correct skinning with this file's hierarchy.
    o.bindMode = 'detached';
  }
});
scene.add(cat);
scene.updateMatrixWorld(true);

// ---- frame the cat (bind-pose bounds from raw geometry) ----
const bbox = new THREE.Box3();
cat.traverse(o => { if (o.isSkinnedMesh) {
  const b = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
  bbox.union(b);
}});
const size = bbox.getSize(new THREE.Vector3());
const center = bbox.getCenter(new THREE.Vector3());
const radius = Math.max(size.x, size.y, size.z);
console.log('BBOX ' + JSON.stringify({ min: bbox.min.toArray(), max: bbox.max.toArray() }));
camera.position.set(center.x + radius*1.6, center.y + radius*0.9, center.z + radius*3.2);
camera.lookAt(center.x, center.y + radius*0.05, center.z);

// ---- animations ----
const mixer = new THREE.AnimationMixer(cat);
const clips = {};
for (const c of gltf.animations) {
  // strip "CharacterArmature|" prefix if present
  const short = c.name.includes('|') ? c.name.split('|').pop() : c.name;
  clips[short] = c;
  clips[c.name] = c;
}
console.log('CLIPS ' + JSON.stringify(Object.keys(clips)));

let current = null;
function play(name, opts={}) {
  const clip = clips[name];
  if (!clip) { console.warn('missing clip', name); return; }
  if (current) current.stop();
  current = mixer.clipAction(clip);
  current.setLoop(opts.loop === false ? THREE.LoopOnce : THREE.LoopRepeat);
  current.clampWhenFinished = !!opts.clamp;
  current.reset().play();
  document.getElementById('anim').textContent = '▶ ' + name;
}

// Greeting: Jump (hello bounce) -> Yes (nod) -> Idle
if (ANIM === 'greet') {
  play('Jump', { loop:false });
  // chain via finished events
  let step = 0;
  mixer.addEventListener('finished', () => {
    step++;
    if (step === 1) play('Yes', { loop:false });
    else if (step === 2) play('Idle');
  });
} else if (clips[ANIM]) {
  play(ANIM);
} else {
  play('Idle');
}

// ---- render loop ----
const clock = new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  mixer.update(dt);
  renderer.render(scene, camera);
})();
</script></body></html>
