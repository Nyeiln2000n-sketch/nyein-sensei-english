<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat 3D Preview — Quaternius (CC0)</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#FFF8F1;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  #app { position:fixed; inset:0; }
  #cap { position:fixed; left:12px; bottom:10px; font-size:12px; color:#8a7a66;
    background:rgba(255,255,255,.75); padding:6px 10px; border-radius:10px; }
  #anim { position:fixed; right:12px; bottom:10px; font-size:12px; color:#8a7a66;
    background:rgba(255,255,255,.75); padding:6px 10px; border-radius:10px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/addons/": "./vendor/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="cap">Quaternius animated cat &middot; CC0 1.0 &middot; recolored brand orange &middot; studio preview</div>
<div id="anim"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const ANIM = q.get('anim') || 'greet';   // Idle | Dance | Yes | No | Walk | Jump | greet
const T = parseFloat(q.get('t') || '0'); // not used; screenshots are time-based

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#FFF8F1');
scene.fog = new THREE.Fog('#FFF8F1', 9, 16);

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 60);

// ---- studio lighting ----
scene.add(new THREE.HemisphereLight('#fff6ea', '#e8d9c4', 0.85));
const key = new THREE.DirectionalLight('#ffffff', 2.0);
key.position.set(3.2, 5.2, 3.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left=-4; key.shadow.camera.right=4;
key.shadow.camera.top=5;  key.shadow.camera.bottom=-3;
key.shadow.radius = 6; key.shadow.blurSamples = 12;
scene.add(key);
const fill = new THREE.DirectionalLight('#cfe8ff', 0.55);
fill.position.set(-4, 2.4, -1.5); scene.add(fill);
const rim = new THREE.DirectionalLight('#ffd9a8', 0.7);
rim.position.set(-1.5, 3.2, -4.5); scene.add(rim);

// ---- ground: soft studio disc + contact shadow ----
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.ShadowMaterial({ opacity: 0.16 })
);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(2.6, 64),
  new THREE.MeshStandardMaterial({ color:'#FFEFD6', roughness:1 })
);
disc.rotation.x = -Math.PI/2; disc.position.y = -0.002; disc.receiveShadow = true; scene.add(disc);

// ---- brand recolor ----
const BRAND = {
  Cat_Main:      '#FF9E3D',  // warm brand orange
  Cat_Secondary: '#C96A12',  // darker orange stripes
  Ears:          '#F4A9BC',  // soft pink inner ear
  Eye_White:     '#FFFFFF',
  Eye_Black:     '#2b2118',
};

const loader = new GLTFLoader();
const gltf = await loader.loadAsync('quaternius_cat.glb');
const cat = gltf.scene;
cat.traverse(o => {
  if (o.isMesh) {
    o.castShadow = true; o.receiveShadow = false;
    o.frustumCulled = false; // skinned mesh: avoid wrong-bounds culling
    const m = o.material;
    if (m && m.name && BRAND[m.name]) { m.color.set(BRAND[m.name]); m.roughness = 0.85; m.metalness = 0; }
  }
});
scene.add(cat);

// frame the cat
const bbox = new THREE.Box3().setFromObject(cat);
const center = bbox.getCenter(new THREE.Vector3());
const size = bbox.getSize(new THREE.Vector3());
const radius = Math.max(size.x, size.y, size.z);
console.log('BBOX min', bbox.min.toArray(), 'max', bbox.max.toArray(), 'size', size.toArray());
window.__dbg = {
  bboxMin: bbox.min.toArray(), bboxMax: bbox.max.toArray(),
  camPos: camera.position.toArray(), camTarget: [center.x, center.y + radius*0.08, center.z],
  meshes: [], clipNames: Object.keys(clips),
};
cat.traverse(o => { if (o.isMesh) window.__dbg.meshes.push({ name:o.name, visible:o.visible, geoVerts: o.geometry.attributes.position.count, isSkinned: !!o.isSkinnedMesh, mat: o.material && o.material.name }); });
camera.position.set(center.x + radius*1.35, center.y + radius*0.72, center.z + radius*2.6);
camera.lookAt(center.x, center.y + radius*0.08, center.z);

// (the single mesh IS the cat — do not hide it)

const mixer = new THREE.AnimationMixer(cat);
const clips = {};
for (const c of gltf.animations) {
  const short = c.name.split('|').pop();
  clips[short] = c;
}
const label = document.getElementById('anim');
function play(name, { loop=false, fade=0.35 } = {}) {
  const clip = clips[name]; if (!clip) return null;
  const a = mixer.clipAction(clip);
  a.reset();
  a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, loop ? Infinity : 1);
  a.clampWhenFinished = !loop;
  a.fadeIn(fade).play();
  label.textContent = 'clip: ' + name + (loop ? ' (loop)' : '');
  return a;
}

const clock = new THREE.Clock();
let phase = 'boot';
const bootT = performance.now();

if (ANIM === 'greet') {
  // GREETING: happy hop + bow (Yes) then settle into Idle
  const jump = play('Jump', { loop:false, fade:0.15 });
  setTimeout(() => play('Yes', { loop:false, fade:0.3 }), 650);
  setTimeout(() => play('Idle', { loop:true, fade:0.6 }), 2300);
  phase = 'greet';
} else {
  play(ANIM, { loop: ANIM==='Idle', fade:0.2 });
  phase = ANIM;
}

// gentle idle breathing on the whole cat
const baseY = cat.position.y;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  mixer.update(dt);
  const s = 1 + Math.sin(t * 2.1) * 0.012;
  cat.scale.set(2 - s > 1 ? 1/Math.sqrt(s) : 1, s, 1); // subtle breathe
  cat.scale.x = cat.scale.z = 1/Math.sqrt(s);
  renderer.render(scene, camera);
}
tick();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
