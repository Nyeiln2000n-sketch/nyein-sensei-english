<html lang="my">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <meta name="theme-color" content="#FFB74D" />

    <meta name="apple-mobile-web-app-title" content="Nyein English" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- P-006: native PWA launch screens (iOS uses these, not the in-app splash). -->
    <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="/splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- PERF: fuente no bloqueante — el CSS de Google Fonts ya no frena el
         primer pintado. Con display=swap el texto aparece al instante con la
         fuente del sistema y cambia a Poppins/Noto cuando llegan. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- PERF: el gato del splash es el LCP — preload con alta prioridad. -->
    <link rel="preload" as="image" href="/mascot.webp" fetchpriority="high" type="image/webp" />
    <title>Nyein Sensei English</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
